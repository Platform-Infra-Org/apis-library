[project]
name = "my-api"  # rename to your API
version = "0.1.0"  # the release version comes from the git tag (APP_VERSION), not from here
requires-python = ">=3.12"
dependencies = [
    "tashtiot-apis-library>=1.3.2",  # from JFrog Artifactory (see uv.toml.example)
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "uvicorn>=0.22",
]

[tool.uv]
package = false  # an application, not a library

[dependency-groups]
# Ranges, not exact pins: exact versions may be missing from the Artifactory mirror.
# uv.lock still pins the resolved versions.
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyjwt>=2.8",
    "respx>=0.21",
    "ruff>=0.17.6,<0.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
