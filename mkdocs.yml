site_name: Tashtiot APIs Library
site_description: >-
  Infrastructure connectors (ArgoCD, AWX, Bitbucket Server, Vault) and a reusable
  FastAPI application template, in one Python package.

# Catch broken in-page anchors (#fragment) under --strict — not validated by default.
validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides  # notice on pages not yet translated (see overrides/main.html)
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # Languages: English (default, at /) and Hebrew (RTL, at /he/). A page is translated by adding
  # `<page>.he.md` next to `<page>.md`; untranslated pages fall back to English with a notice.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true  # language switcher in the header + per-language search
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: he
          name: עברית
          build: true
          site_name: ספריית ה-APIs של תשתיות
          site_description: >-
            מחברים לתשתיות (ArgoCD, AWX, Bitbucket Server, Vault) ותבנית אפליקציית FastAPI
            לשימוש חוזר, בחבילת Python אחת.
          theme:
            language: he  # Material switches the whole layout to right-to-left
          admonition_translations:
            note: הערה
            tip: טיפ
            info: מידע
            warning: אזהרה
            important: חשוב
            danger: סכנה
            example: דוגמה
          nav_translations:
            Home: בית
            Tutorials: מדריכים למתחילים
            Your first app: האפליקציה הראשונה שלך
            Secure your API: אבטחת ה-API שלך
            How-to guides: מדריכי ביצוע
            Read & write Bitbucket files: קריאה וכתיבה של קבצים ב-Bitbucket
            Drive AWX, ArgoCD & Vault: עבודה עם AWX, ArgoCD ו-Vault
            Secure an API with OIDC &amp; JWKS: אבטחת API עם OIDC ו-JWKS
            Verify a token outside a request: אימות טוקן מחוץ לבקשה
            Call other services with SSO: קריאה לשירותים אחרים עם SSO
            Enable the Remote Config API: הפעלת Remote Config API
            Constrain a field by resolved config: הגבלת שדה לפי קונפיגורציה
            Generate dev auth material: יצירת חומרי אימות לפיתוח
            Add a new connector: הוספת מחבר חדש
            Extend the FastAPI template: הרחבת תבנית FastAPI
            Migrate an API to the current version: הסבת API לגרסה הנוכחית
            Reference: מידע עזר
            API standards: תקני API
            Configuration: קונפיגורציה
            CLI (gen-auth-material): CLI ‏(gen-auth-material)
            API: API
            Connectors: מחברים
            FastAPI app: אפליקציית FastAPI
            Auth (inbound JWT): אימות (JWT נכנס)
            Security (outbound SSO): אבטחה (SSO יוצא)
            Remote Config API: Remote Config API
            Errors: שגיאות
            Schemas: סכמות
            Explanation: הסברים
            Architecture: ארכיטקטורה
            Authentication design: תכנון האימות
            Dynamic config validation: ולידציה דינמית של קונפיגורציה
            OpenAPI & Swagger injection: הזרקה ל-OpenAPI ול-Swagger
            Logging: לוגים
            Async and the event loop: אסינכרוניות ולולאת האירועים
            Job queues & long-running work: תורי משימות ועבודה ארוכה
            Cloud-native APIs & multiple replicas: APIs ענן-נייטיב וריבוי רפליקות
            Contributing: תרומה לפרויקט
            Development: פיתוח
            Changelog: יומן שינויים
  # The API reference pages are built once per language, so each symbol has an anchor in both;
  # link to the one in the same language as the current page.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
            show_if_no_docstring: true  # list public symbols in module pages even without a docstring
            scoped_crossrefs: true      # resolve [`Name`][Name] cross-refs up the scope chain

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html                 # enables grid cards (markdown inside HTML)
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:            # renders :material-*: shortcodes as inline SVG icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]          # allow including repo-root files (e.g. CHANGELOG.md)
      check_paths: true         # fail the build if an included file is missing
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Your first app: tutorials/first-app.md
      - Secure your API: tutorials/secure-your-api.md
  - How-to guides:
      - how-to/index.md
      - Read & write Bitbucket files: how-to/read-write-bitbucket.md
      - Drive AWX, ArgoCD & Vault: how-to/use-awx-argocd-vault.md
      - Secure an API with OIDC &amp; JWKS: how-to/secure-with-oidc-jwks.md
      - Verify a token outside a request: how-to/verify-a-token.md
      - Call other services with SSO: how-to/call-services-with-sso.md
      - Enable the Remote Config API: how-to/enable-remote-config-api.md
      - Constrain a field by resolved config: how-to/constrain-field-by-config.md
      - Generate dev auth material: how-to/generate-auth-material.md
      - Add a new connector: how-to/add-a-connector.md
      - Extend the FastAPI template: how-to/extend-the-template.md
      - Migrate an API to the current version: how-to/migrate-an-api.md
  - Reference:
      - reference/index.md
      - API standards: reference/api-standards.md
      - Configuration: reference/configuration.md
      - CLI (gen-auth-material): reference/cli.md
      - API:
          - Connectors: reference/api/connectors.md
          - FastAPI app: reference/api/fastapi-app.md
          - Auth (inbound JWT): reference/api/auth.md
          - Security (outbound SSO): reference/api/security.md
          - Remote Config API: reference/api/config-api.md
          - Errors: reference/api/errors.md
          - Schemas: reference/api/schemas.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md
      - Authentication design: explanation/authentication.md
      - Dynamic config validation: explanation/dynamic-config-validation.md
      - OpenAPI & Swagger injection: explanation/openapi-swagger-injection.md
      - Logging: explanation/logging.md
      - Async and the event loop: explanation/async.md
      - Job queues & long-running work: explanation/job-queues.md
      - Cloud-native APIs & multiple replicas: explanation/cloud-native.md
  - Contributing:
      - contributing/index.md
      - Development: contributing/development.md
  - Changelog: changelog.md
